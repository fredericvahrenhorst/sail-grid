services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017
      NUXT_MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: sailgrid
      NUXT_MONGODB_DB: sailgrid
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      NUXT_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:?set NUXT_SESSION_PASSWORD}
      NUXT_PUBLIC_BASE_URL: ${NUXT_PUBLIC_BASE_URL:-http://localhost:3000}
      NUXT_PUBLIC_LANG: ${NUXT_PUBLIC_LANG:-de}
      ALLOWED_FRAME_ANCESTORS: ${ALLOWED_FRAME_ANCESTORS:-self}
      NUXT_ALLOWED_FRAME_ANCESTORS: ${ALLOWED_FRAME_ANCESTORS:-self}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - sailgrid-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  sailgrid-mongo:
